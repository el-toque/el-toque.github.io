name: Validate IPV JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application scripts
        run: |
          node --check app.js
          node --check turn-inventory.js
          node --check tienda/store.js
